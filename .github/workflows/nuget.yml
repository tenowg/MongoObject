name: Publish NuGet Package

permissions:
  contents: read

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-alpha'
      - '[0-9]+.[0-9]+.[0-9]+-beta'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: "Nuget"

    defaults:
      run:
        working-directory: ./main

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        path: main
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore -p:MinVerVersionOverride=${{ github.ref_name }} -p:PackageVersion=${{ github.ref_name }}
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack Package
      run: dotnet pack --configuration Release --no-build -p:MinVerVersionOverride=${{ github.ref_name }} -p:PackageVersion=${{ github.ref_name }} --output .

    - name: Push to NuGet
      run: dotnet nuget push *.nupkg --api-key ${{ secrets.NUGET_API }} --source https://api.nuget.org/v3/index.json --skip-duplicate
