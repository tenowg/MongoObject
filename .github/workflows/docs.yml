name: Build and Deploy Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'Docs/**'
      - 'MongoObject.Core/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for git metadata
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build solution
      run: dotnet build --configuration Release --no-restore
    
    - name: Setup DocFX
      run: |
        dotnet tool install -g docfx
    
    - name: Build documentation
      run: |
        cd Docs
        docfx metadata
        docfx docfx.json
    - name: Generate LLM Index
      run: |
        cd Docs
        TARGET_DIR="_site/llm-api"
        INDEX_FILE="$TARGET_DIR/api-index.md"
        
        echo "# API Reference Map for AI Agents" > "$INDEX_FILE"
        echo "This map contains a flat directory of available APIs. Read this file first to find the exact markdown path for any class, interface, method, or namespace before parsing deeper." >> "$INDEX_FILE"
        echo "" >> "$INDEX_FILE"
        
        # Find all generated markdown files (ignoring TOC files and the index itself)
        find "$TARGET_DIR" -type f -name "*.md" ! -name "toc.md" ! -name "api-index.md" | while read -r file; do
            # Extract the first heading line (# Title)
            TITLE_LINE=$(grep -m 1 "^# " "$file")
            if [ -not -z "$TITLE_LINE" ]; then
                SYMBOL_NAME=$(echo "$TITLE_LINE" | sed 's/# //g')
                # Get a path relative to the website root
                RELATIVE_PATH=$(echo "$file" | sed 's|_site/||g')
                
                TYPE="Class/Member"
                if [[ "$SYMBOL_NAME" == *"Namespace"* ]]; then TYPE="Namespace"; fi
                if [[ "$file" == *"interface"* ]]; then TYPE="Interface"; fi
                
                echo "- **$SYMBOL_NAME** ($TYPE) -> Read details at: \`/$RELATIVE_PATH\`" >> "$INDEX_FILE"
            fi
        done
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: Docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
